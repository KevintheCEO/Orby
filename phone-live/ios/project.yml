name: OrbyLive
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.2"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  OrbyLive:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.OrbyLive
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Orby Live
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        NSFaceIDUsageDescription: Confirm individual AI permission decisions.
        CFBundleURLTypes:
          - CFBundleURLName: com.example.OrbyLive
            CFBundleURLSchemes: [orbylive]
    entitlements:
      path: App/OrbyLive.entitlements
      properties:
        aps-environment: development
    dependencies:
      - target: OrbyLiveWidget
  OrbyLiveWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.OrbyLive.Widget
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Orby Live
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  OrbyLive:
    build:
      targets:
        OrbyLive: all
