name: iPhone compile check
on:
  workflow_dispatch:
  push:
    paths: ['phone-live/ios/**', 'phone-live/.github/workflows/ios-build.yml', '.github/workflows/iphone-build.yml']
  pull_request:
    paths: ['phone-live/ios/**', '.github/workflows/iphone-build.yml']
permissions:
  contents: read
concurrency:
  group: iphone-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulator-build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Find project directory
        run: |
          if [ -d phone-live/ios ]; then echo "PROJECT_DIR=phone-live/ios" >> "$GITHUB_ENV"; else echo "PROJECT_DIR=ios" >> "$GITHUB_ENV"; fi
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Generate project
        run: cd "$PROJECT_DIR" && xcodegen generate
      - name: Compile iPhone Simulator
        run: |
          cd "$PROJECT_DIR"
          set -o pipefail
          xcodebuild -project OrbyLive.xcodeproj -scheme OrbyLive -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO build | tee simulator-build.log
      - name: Compile unsigned iPhone device binary
        run: |
          cd "$PROJECT_DIR"
          set -o pipefail
          xcodebuild -project OrbyLive.xcodeproj -scheme OrbyLive -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO build | tee device-build.log
      - name: Retain compilation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-build-diagnostics
          path: |
            ${{ env.PROJECT_DIR }}/*-build.log
          retention-days: 1
      - name: Record result
        run: |
          echo 'Both simulator and device source compilation passed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No signed IPA was produced. This job does not install the app, enable APNs, or verify a real iPhone.' >> "$GITHUB_STEP_SUMMARY"
